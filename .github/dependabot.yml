# At most one pull request a month per ecosystem, with every update grouped into it.
# Fixes for security advisories are not held back by the schedule.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      crates:
        patterns: ["*"]
    commit-message:
      prefix: "deps"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
