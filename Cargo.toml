[package]
name = "halcyon"
version = "1.0.1"
edition = "2024"
description = "Open-source control software for RGB keyboards: lighting, key remapping, macros and displays"
license = "MIT"
readme = "README.md"
keywords = ["keyboard", "rgb", "hid", "leobog", "macros"]
categories = ["hardware-support", "command-line-utilities"]
rust-version = "1.88"

[dependencies]
base64 = "0.23.1"
chrono = "0.4.45"
dirs = "7.0.0"
getrandom = "0.4.3"
hidapi = "2.6.7"
image = { version = "0.25.10", default-features = false, features = ["gif", "png", "jpeg", "webp", "bmp"] }
include_dir = "0.7.4"
open = "5.4.5"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde_json = "1.0.154"
tao = "0.37.2"
tiny_http = "0.12.0"
wry = "0.57.2"

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"

# `cargo bundle --release` (cargo-bundle) builds Halcyon.app on macOS and a .deb on Linux.
[package.metadata.bundle]
name = "Halcyon"
identifier = "io.github.halcyon.keyboard"
icon = ["assets/logo.png"]
category = "public.app-category.utilities"
short_description = "Open-source control software for RGB keyboards"
long_description = "Lighting, per-key colours, key remapping, macros and keyboard displays, without the vendor software."
